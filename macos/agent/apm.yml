name: agent-config
version: 1.0.3
description: Machine-wide MCP and rules for Cursor, OpenCode, Codex, Claude 
  Code, and Antigravity
author: Alejandro Akbal
targets:
  - cursor
  - opencode
  - codex
  - claude
  - antigravity
dependencies:
  apm:
    - shadcn/improve
    - Leonxlnx/taste-skill
    - git: uditgoenka/autoresearch
      path: .agents/skills/autoresearch
  mcp:
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp
    # Replaced by 9router-mcp. Keep commented for easy rollback.
    # - name: exa
    #   registry: false
    #   transport: stdio
    #   command: pnpx
    #   args:
    #     - "-y"
    #     - "dotenv-cli"
    #     - "-e"
    #     - "/Users/alejandro/.config/agent-secrets.env"
    #     - "--"
    #     - "pnpx"
    #     - "-y"
    #     - "exa-mcp-server"
    - name: 9router-search
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "-y"
        - "9router-mcp@latest"
      env:
        ROUTER_BASE_URL: "http://127.0.0.1:20128/v1"
        # 9router-mcp currently requires an Authorization header even on local setups.
        ROUTER_API_KEY: "sk_9router"
    # - name: n8n-mcp
    #   registry: false
    #   transport: http
    #   url: https://n8n.akbal.dev/mcp-server/http
    #   headers:
    #     Authorization: "Bearer ${N8N_MCP_TOKEN}"
    - name: sentry
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "-y"
        - "mcp-remote@latest"
        - "https://mcp.sentry.dev/mcp"
    # - name: coolify
    #   registry: false
    #   transport: http
    #   url: https://coolify.akbal.dev/mcp
    #   headers:
    #     Authorization: "${COOLIFY_MCP_AUTH_HEADER}"
    - name: chrome-devtools
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "chrome-devtools-mcp@latest"
        - "--autoConnect"
    - name: lighthouse
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "-y"
        - "@danielsogl/lighthouse-mcp@latest"
    # - name: matomo
    #   registry: false
    #   transport: http
    #   url: https://matomo.akbal.dev/index.php?module=API&method=McpServer.mcp&format=mcp
    #   headers:
    #     Authorization: "Bearer ${MATOMO_API_TOKEN}"
    # Google Search Console
    - name: gsc
      registry: false
      transport: stdio
      command: /opt/homebrew/bin/uvx
      args:
        - mcp-search-console
      env:
        GSC_OAUTH_CLIENT_SECRETS_FILE: "/Users/alejandro/.config/gsc/client_secrets.json"
    # Replaced by 9router-mcp. Keep commented for easy rollback.
    # - name: brave-search
    #   registry: false
    #   transport: stdio
    #   command: pnpx
    #   args:
    #     - "-y"
    #     - "dotenv-cli"
    #     - "-e"
    #     - "/Users/alejandro/.config/agent-secrets.env"
    #     - "--"
    #     - "pnpx"
    #     - "-y"
    #     - "@brave/brave-search-mcp-server"
    #     - "--transport"
    #     - "stdio"
    - name: maestro
      registry: false
      transport: stdio
      command: /opt/homebrew/bin/maestro
      args:
        - mcp
      env:
        JAVA_HOME: "/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home"
        MAESTRO_CLI_NO_ANALYTICS: "1"
includes: auto
scripts: {}
