name: agent-config
version: 1.0.0
description: Machine-wide MCP and rules for Cursor, OpenCode, and Codex
author: Alejandro Akbal
targets:
  - cursor
  - opencode
  - codex
dependencies:
  apm: []
  mcp:
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp
    - name: n8n-mcp
      registry: false
      transport: http
      url: https://n8n.akbal.dev/mcp-server/http
      headers:
        Authorization: "Bearer ${N8N_MCP_TOKEN}"
    - name: sentry
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "-y"
        - "mcp-remote@latest"
        - "https://mcp.sentry.dev/mcp"
    - name: coolify
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "-y"
        - "mcp-remote@latest"
        - "https://coolify.akbal.dev/mcp"
        - "--header"
        - "Authorization:${COOLIFY_MCP_AUTH_HEADER}"
    - name: chrome-devtools
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "chrome-devtools-mcp@latest"
        - "--autoConnect"
    - name: lighthouse
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "-y"
        - "@danielsogl/lighthouse-mcp@latest"
    - name: matomo
      registry: false
      transport: http
      url: https://matomo.akbal.dev/index.php?module=API&method=McpServer.mcp&format=mcp
      headers:
        Authorization: "Bearer ${MATOMO_API_TOKEN}"
    - name: google-search-console
      registry: false
      transport: stdio
      command: /Users/alejandro/.local/bin/mcp-search-console
      env:
        GSC_OAUTH_CLIENT_SECRETS_FILE: "/Users/alejandro/.config/gsc/client_secrets.json"
includes: auto
scripts: {}
