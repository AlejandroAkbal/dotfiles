name: agent-config
version: 1.0.3
description: Machine-wide MCP and rules for OpenCode (other targets disabled below)
author: Alejandro Akbal
targets:
  - opencode
  # Disabled — uncomment to re-enable multi-editor deploy:
  # - cursor
  # - codex
  # - claude
  # - antigravity
dependencies:
  apm:
    - shadcn/improve
    - git: Leonxlnx/taste-skill
      path: skills/taste-skill
    - git: uditgoenka/autoresearch
      path: .agents/skills/autoresearch
    - git: coderabbitai/skills
      path: skills/code-review
    - git: coderabbitai/skills
      path: skills/autofix
    # - git: browser-use/browser-use
    #   path: skills/browser-use
    - addyosmani/agent-skills
  mcp:
    - name: context7
      registry: false
      transport: http
      url: https://mcp.context7.com/mcp
    - name: exa
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "-y"
        - "dotenv-cli"
        - "-e"
        - "/Users/alejandro/.config/agent-secrets.env"
        - "--"
        - "pnpx"
        - "-y"
        - "exa-mcp-server"
    - name: 9router-search
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "-y"
        - "dotenv-cli"
        - "-e"
        - "/Users/alejandro/.config/agent-secrets.env"
        - "--"
        - "pnpx"
        - "-y"
        - "9router-mcp@latest"
    - name: n8n-mcp
      registry: false
      transport: http
      url: https://n8n.akbal.dev/mcp-server/http
      headers:
        Authorization: "Bearer ${N8N_MCP_TOKEN}"
    - name: sentry
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "-y"
        - "mcp-remote@latest"
        - "https://mcp.sentry.dev/mcp"
    - name: coolify
      registry: false
      transport: http
      url: https://coolify.akbal.dev/mcp
      headers:
        Authorization: "${COOLIFY_MCP_AUTH_HEADER}"
    - name: chrome-devtools
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "chrome-devtools-mcp@latest"
        - "--autoConnect"
    - name: lighthouse
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "-y"
        - "@danielsogl/lighthouse-mcp@latest"
    - name: matomo
      registry: false
      transport: http
      url: https://matomo.akbal.dev/index.php?module=API&method=McpServer.mcp&format=mcp
      headers:
        Authorization: "Bearer ${MATOMO_API_TOKEN}"
    # Google Search Console
    - name: google_search_console
      registry: false
      transport: stdio
      command: /opt/homebrew/bin/uvx
      args:
        - mcp-search-console
      env:
        GSC_OAUTH_CLIENT_SECRETS_FILE: "/Users/alejandro/.config/gsc/client_secrets.json"
    - name: brave-search
      registry: false
      transport: stdio
      command: pnpx
      args:
        - "-y"
        - "dotenv-cli"
        - "-e"
        - "/Users/alejandro/.config/agent-secrets.env"
        - "--"
        - "pnpx"
        - "-y"
        - "@brave/brave-search-mcp-server"
        - "--transport"
        - "stdio"
    - name: maestro
      registry: false
      transport: stdio
      command: /opt/homebrew/bin/maestro
      args:
        - mcp
      env:
        JAVA_HOME: "/opt/homebrew/opt/openjdk/libexec/openjdk.jdk/Contents/Home"
        MAESTRO_CLI_NO_ANALYTICS: "1"
includes: auto
scripts: {}
